<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Registro — CerradaApp</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#eef2f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:20px;padding:32px 24px;max-width:400px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.logo{text-align:center;margin-bottom:24px}
.logo-ico{font-size:48px;line-height:1;margin-bottom:8px}
.logo-title{font-size:22px;font-weight:800;color:#1e3a5f}
.logo-sub{font-size:13px;color:#64748b;margin-top:4px}
.badge{display:inline-block;background:#dbeafe;color:#1d4ed8;font-weight:700;font-size:14px;padding:6px 14px;border-radius:8px;margin-bottom:8px}
.cerrada-name{font-size:13px;color:#64748b;margin-bottom:16px}
h2{font-size:18px;font-weight:800;color:#1e3a5f;margin-bottom:16px}
label{display:block;font-size:12px;font-weight:700;color:#475569;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.4px}
input{display:block;width:100%;padding:12px 14px;border:2px solid #e2e8f0;border-radius:10px;font-family:inherit;font-size:16px;color:#1e3a5f;outline:none;-webkit-appearance:none}
input:focus{border-color:#3b82f6}
.hint{font-size:11px;color:#94a3b8;margin-top:4px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;margin-top:20px;-webkit-appearance:none;text-align:center}
.btn-blue{background:#2563eb;color:#fff}
.btn-blue:disabled{opacity:.5}
.msg{padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-top:12px;text-align:center;line-height:1.4}
.msg-err{background:#fee2e2;color:#b91c1c}
.msg-ok{background:#dcfce7;color:#166534}
.step{display:none}
.step.on{display:block}
.center{text-align:center;padding:16px 0}
.big-ico{font-size:56px;margin-bottom:12px}
.prog{display:flex;gap:6px;margin-bottom:20px}
.prog-dot{flex:1;height:4px;border-radius:2px;background:#e2e8f0}
.prog-dot.done{background:#2563eb}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-ico">&#127960;</div>
    <div class="logo-title">CerradaApp</div>
    <div class="logo-sub">Control de acceso comunitario</div>
  </div>

  <!-- Formulario — se muestra inmediatamente sin llamadas de red -->
  <div class="step on" id="s-form">
    <div class="prog">
      <div class="prog-dot done"></div>
      <div class="prog-dot" id="pd2"></div>
      <div class="prog-dot" id="pd3"></div>
    </div>
    <h2 id="ftitle">Completa tu registro</h2>
    <div class="badge" id="fhouse">&#127968;</div>
    <div class="cerrada-name" id="fcerrada"></div>
    <label>Nombre completo</label>
    <input id="iname" type="text" placeholder="Juan Perez" autocomplete="name">
    <label>Correo electronico</label>
    <input id="iemail" type="email" placeholder="juan@correo.com" autocomplete="email">
    <div class="hint">Lo usaras para iniciar sesion</div>
    <label>Crea tu PIN (4-8 digitos)</label>
    <input id="ipin" type="password" maxlength="8" placeholder="****" inputmode="numeric">
    <label>Confirma tu PIN</label>
    <input id="ipin2" type="password" maxlength="8" placeholder="****" inputmode="numeric">
    <div id="fmsg"></div>
    <button class="btn btn-blue" id="breg" onclick="doReg()">Completar Registro</button>
  </div>

  <!-- Exito -->
  <div class="step" id="s-ok">
    <div class="center">
      <div class="big-ico">&#127881;</div>
      <h2>Registro exitoso!</h2>
      <p style="color:#64748b;font-size:14px;margin:8px 0 20px" id="okmsg">Ya puedes abrir el porton.</p>
      <button class="btn btn-blue" onclick="location.href='https://racosta123.github.io/cerradaapp/'">Ir a la App</button>
    </div>
  </div>

  <!-- Error -->
  <div class="step" id="s-err">
    <div class="center">
      <div class="big-ico">&#9888;</div>
      <h2 style="color:#dc2626">Link invalido</h2>
      <p style="color:#64748b;font-size:14px;margin-top:8px" id="errmsg">Link no valido o expirado. Pide al administrador uno nuevo.</p>
    </div>
  </div>
</div>

<script>
var REG = null;
var DATA = null;
var JB = 'https://api.jsonbin.io/v3/b';
var WORKER = 'https://shelly-proxy.acosta4770.workers.dev';

function show(id){
  var steps = document.querySelectorAll('.step');
  for(var i=0;i<steps.length;i++) steps[i].className='step';
  document.getElementById(id).className='step on';
}

function showMsg(t,type){
  var e=document.getElementById('fmsg');
  e.className='msg msg-'+(type||'err');
  e.textContent=t;
}

function decode(raw){
  try{
    var b=raw.replace(/-/g,'+').replace(/_/g,'/');
    var p=b.length%4?b+'==='.slice(b.length%4):b;
    return JSON.parse(atob(p));
  }catch(e){return null;}
}

function norm(t){return(t||'').replace(/[^a-zA-Z0-9]/g,'').toLowerCase();}

// Inicializar — mostrar formulario SIN llamadas de red
function init(){
  var href = location.href;
  var qi = href.indexOf('?');
  if(qi<0){show('s-err');return;}
  var params = new URLSearchParams(href.slice(qi+1));
  var raw = params.get('reg');
  if(!raw){show('s-err');return;}

  REG = decode(raw);
  if(!REG||!REG.token||!REG.binId||!REG.house){
    show('s-err');return;
  }

  // Mostrar datos del payload sin verificar en red (eso se hace al enviar)
  var isFam = !!REG.isFamiliar;
  document.getElementById('fhouse').textContent = 'Casa: ' + REG.house;
  document.getElementById('fcerrada').textContent = REG.cerradaName || '';
  document.getElementById('ftitle').textContent = isFam ? 'Registro como familiar' : 'Completa tu registro';
  if(!isFam && REG.email && REG.email.indexOf('ejemplo') < 0){
    document.getElementById('iemail').value = REG.email;
  }
  // s-form ya esta visible por defecto
}

function doReg(){
  var name  = document.getElementById('iname').value.trim();
  var email = document.getElementById('iemail').value.trim().toLowerCase();
  var pin   = document.getElementById('ipin').value.trim();
  var pin2  = document.getElementById('ipin2').value.trim();

  if(!name){showMsg('Escribe tu nombre');return;}
  if(!email||email.indexOf('@')<0){showMsg('Correo no valido');return;}
  if(!pin||pin.length<4){showMsg('PIN minimo 4 digitos');return;}
  if(!/^\d+$/.test(pin)){showMsg('PIN solo numeros');return;}
  if(pin!==pin2){showMsg('Los PINes no coinciden');return;}

  var btn=document.getElementById('breg');
  btn.disabled=true;
  btn.innerHTML='<span class="spin"></span>Registrando...';
  showMsg('Conectando...','ok');

  // Ahora sí hacemos la llamada a JSONBin
  fetch(WORKER+'/jb?bin='+REG.binId+'&key='+encodeURIComponent(REG.apiKey))
    .then(function(r){
      if(!r.ok) throw new Error('Error de conexion ('+r.status+')');
      return r.json();
    })
    .then(function(d){
      DATA = d.record || d;
      var rs = DATA.residents||[];
      var resIdx = -1;
      for(var i=0;i<rs.length;i++){if(rs[i].house===REG.house){resIdx=i;break;}}
      if(resIdx<0) throw new Error('Casa no encontrada');

      var res = rs[resIdx];
      var isFam = !!REG.isFamiliar;
      var stored = isFam ? res.familiarToken : res.inviteToken;
      var expires = isFam ? res.familiarTokenExpires : res.inviteExpires;
      var tokenOk = stored && REG.token && norm(stored)===norm(REG.token);
      var notExp = !expires || Date.now()<expires;

      console.log('DEBUG isFam:',isFam,'stored:',stored,'link:',REG.token,'ok:',tokenOk,'notExp:',notExp);
      if(!tokenOk||!notExp){
        var det = !stored ? 'Sin token guardado' : !tokenOk ? 'Token no coincide' : 'Expirado';
        throw new Error(det);
      }

      if(isFam){
        if(!res.members) res.members=[];
        var fams=res.members.filter(function(m){return m.role!=='head';});
        if(fams.length>=4) throw new Error('Maximo 4 familiares por casa');
        res.members.push({name:name,email:email,pin:pin,role:'member',registeredAt:new Date().toISOString()});
        res.familiarToken=null; res.familiarTokenExpires=null;
      } else {
        res.name=name; res.email=email; res.pin=pin;
        res.active=true; res.pendingReg=false;
        if(!res.members) res.members=[];
        var hi=-1;
        for(var j=0;j<res.members.length;j++){if(res.members[j].role==='head'){hi=j;break;}}
        var ho={name:name,email:email,pin:pin,role:'head',registeredAt:new Date().toISOString()};
        if(hi>=0) res.members[hi]=ho; else res.members.unshift(ho);
        res.inviteToken=null; res.inviteExpires=null;
      }
      DATA.residents[resIdx]=res;

      return fetch(WORKER+'/jb',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({bin:REG.binId,key:REG.apiKey,data:DATA})
      });
    })
    .then(function(r){return r.json();})
    .then(function(saved){
      if(!saved.ok) throw new Error('Error al guardar');
      document.getElementById('pd2').className='prog-dot done';
      document.getElementById('pd3').className='prog-dot done';
      document.getElementById('okmsg').textContent =
        'Bienvenido a '+(DATA&&DATA.name?DATA.name:REG.cerradaName||'la cerrada')+
        '. Ya puedes abrir el porton.';
      show('s-ok');
    })
    .catch(function(e){
      showMsg('Error: '+e.message);
      btn.disabled=false;
      btn.innerHTML='Completar Registro';
    });
}

init();
</script>
</body>
</html>
