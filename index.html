<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Catorce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1 id="title">Monitor Catorce</h1>
        <div id="content">
            <p id="message">Cargando datos de la cerrada...</p>
            <div id="buttons-container" style="display: none;">
                <button class="btn" id="btn-usuarios" onclick="window.location.href='usuarios.html'">Usuarios</button>
                <button class="btn" id="btn-visitantes" onclick="window.location.href='visitantes.html'">Visitantes</button>
                <button class="btn action-btn" id="btn-abrir">ACCIONAR ENTRADA</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        /**
         * CORRECCIÓN PARA SHELLY: 
         * Mantiene la conexión activa para evitar el retraso al "despertar".
         */
        const SHELLY_IP = "192.168.1.100"; // Sustituye por la IP local de tu Shelly

        function keepShellyAlive() {
            setInterval(() => {
                fetch(`http://${SHELLY_IP}/status`, { mode: 'no-cors' })
                    .then(() => console.log("Shelly Wake-up Pulse Sent"))
                    .catch(() => console.error("Shelly Local Offline - Using Cloud Mode"));
            }, 15000); // Pulso cada 15 segundos
        }

        // Iniciar el pulso al cargar la página
        window.addEventListener('load', keepShellyAlive);

        // Optimización del botón de apertura
        const btnAbrir = document.getElementById('btn-abrir');
        if(btnAbrir) {
            btnAbrir.addEventListener('click', () => {
                // Intento local inmediato
                fetch(`http://${SHELLY_IP}/relay/0?turn=on&timer=2`, { mode: 'no-cors' })
                .catch(() => {
                    // Si falla el local, el script.js original manejará la lógica de nube
                    console.log("Local fetch failed, relying on script.js logic");
                });
            });
        }
    </script>
</body>
</html>
